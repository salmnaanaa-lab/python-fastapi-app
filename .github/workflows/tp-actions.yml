name: Third-Party and Custom Actions Lab

on:
  push:
    branches:
      - feature/tp-actions
    paths:
      - ".github/workflows/tp-actions.yml"
      - ".github/actions/build-info/**"
      - ".github/actions/docker-hello/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Run build info action
        id: info
        uses: ./.github/actions/build-info
        with:
          app-name: my-app

      - name: Print build id
        env:
          BUILD_ID: ${{ steps.info.outputs.build-id }}
        run: |
          echo "Build id is $BUILD_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print Node.js version
        run: node --version

      - name: Generate build report
        run: |
          printf 'Node.js %s | Date %s\n' "$(node --version)" "$(date -u +%FT%TZ)" > report.txt
          cat report.txt

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: .

      - name: Print build report
        run: cat report.txt

  docker-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Run Docker hello action
        uses: ./.github/actions/docker-hello
        with:
          who: Salma
