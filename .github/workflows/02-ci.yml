name: CI

on: [push]
env:
  APP_NAME: fastapi-starter
jobs:

  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verifier le style
        run: ruff check .

  build:
    name: Build - Verifier application
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
            - name: Afficher les contextes
        env:
          APP: ${{ env.APP_NAME }}
          ACTEUR: ${{ github.actor }}
          EVENEMENT: ${{ github.event_name }}
          BRANCHE: ${{ github.ref_name }}
          SHA_COMMIT: ${{ github.sha }}
          SYSTEME: ${{ runner.os }}
          SOURCE_PR: ${{ github.head_ref }}
          CIBLE_PR: ${{ github.base_ref }}
        run: |
          echo "Application = $APP"
          echo "Acteur = $ACTEUR"
          echo "Evenement = $EVENEMENT"
          echo "Branche = $BRANCHE"
          echo "SHA = $SHA_COMMIT"
          echo "Runner OS = $SYSTEME"
          echo "Branche source PR = $SOURCE_PR"
          echo "Branche cible PR = $CIBLE_PR"
      - name: Executer les tests
        run: python -m pytest